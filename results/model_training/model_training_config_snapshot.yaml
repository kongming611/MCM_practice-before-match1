random_seed: 20260805
input:
  attachment1: data/附件1：123家有信贷记录企业的相关数据.xlsx
  expected_sheets:
    enterprise: 企业信息
    input_invoice: 进项发票信息
    output_invoice: 销项发票信息
  required_columns:
    enterprise:
    - 企业代号
    - 企业名称
    - 信誉评级
    - 是否违约
    invoice:
    - 企业代号
    - 发票号码
    - 开票日期
    - 金额
    - 税额
    - 价税合计
    - 发票状态
processing:
  amount_column: 价税合计
  amount_unit_divisor: 10000
  amount_tolerance_yuan: 0.01
  zero_amount_tolerance_yuan: 0.01
  status_aliases:
    valid:
    - 有效
    - 有效发票
    void:
    - 作废
    - 作废发票
  unknown_status_policy: error
  invalid_date_policy: error
  exact_duplicate_policy: keep_first
  analysis_start: null
  analysis_end: null
  boundary_month_policy: include
  missing_counterparty_policy: exclude_from_concentration
  denominator_policy: zero_denominator_to_na
  outlier_quantiles:
    lower: 0.01
    upper: 0.99
features:
  names:
  - business_scale_10k
  - sales_scale_10k
  - purchase_scale_10k
  - net_sales_10k
  - operating_net_inflow_proxy_10k
  - sales_growth_trend
  - sales_monthly_cv
  - invoice_activity_per_month
  - sales_return_rate
  - purchase_return_rate
  - void_invoice_rate
  - zero_amount_invoice_rate
  - customer_count
  - supplier_count
  - customer_hhi
  - supplier_hhi
  - max_customer_share
  - max_supplier_share
  - purchase_sales_ratio
  - active_month_ratio
  - longest_active_streak_ratio
  bounded_01:
  - void_invoice_rate
  - zero_amount_invoice_rate
  - customer_hhi
  - supplier_hhi
  - max_customer_share
  - max_supplier_share
  - active_month_ratio
  - longest_active_streak_ratio
  primary_model_features:
  - sales_scale_10k
  - purchase_scale_10k
  - operating_net_inflow_proxy_10k
  - sales_growth_trend
  - sales_monthly_cv
  - invoice_activity_per_month
  - sales_return_rate
  - purchase_return_rate
  - void_invoice_rate
  - customer_count
  - supplier_count
  - customer_hhi
  - supplier_hhi
  - purchase_sales_ratio
  - active_month_ratio
  sensitivity_model_features:
  - business_scale_10k
  - sales_scale_10k
  - purchase_scale_10k
  - net_sales_10k
  - operating_net_inflow_proxy_10k
  - sales_growth_trend
  - sales_monthly_cv
  - invoice_activity_per_month
  - sales_return_rate
  - purchase_return_rate
  - void_invoice_rate
  - customer_count
  - supplier_count
  - customer_hhi
  - supplier_hhi
  - max_customer_share
  - max_supplier_share
  - purchase_sales_ratio
  - active_month_ratio
  - longest_active_streak_ratio
  excluded_from_model:
    zero_amount_invoice_rate:
      reason: constant_valid_zero_rate_and_void_only_raw_zero_records
      role: audit_only
outputs:
  audit_dir: results/audit
  feature_dir: results/features
  intermediate_dir: results/intermediate
  reports_dir: results/reports
  logs_dir: logs
  manifest: results/reports/q1_run_manifest.json
logging:
  level: INFO
model_training:
  random_state: 20260805
  cv:
    n_splits: 5
    n_repeats: 10
  bootstrap_replicates: 2000
  top_risk_fraction: 0.2
  calibration_bins: 5
  preprocessing:
    winsor_lower: 0.01
    winsor_upper: 0.99
    scaler: RobustScaler
  logistic:
    solver: saga
    penalty: elasticnet
    C: 0.2
    l1_ratio: 0.8
    max_iter: 5000
  tree:
    class_name: HistGradientBoostingClassifier
    max_iter: 100
    learning_rate: 0.05
    max_leaf_nodes: 3
    min_samples_leaf: 15
    l2_regularization: 10.0
