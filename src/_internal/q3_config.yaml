# Stage-three deterministic external-stress overlay.  The source values and
# interpretation are fixed by the Q0 contract; c_pp/rho/lambda/eps are team
# modeling assumptions, not official estimates.
stress_scenarios:
  input: data/processed/q2_risk_rating_scores.csv
  industry_mapping_input: data/processed/q3_enterprise_industry_mapping.csv
  risk_output: data/processed/q3_scenario_risk_scores.csv
  industry_output: outputs/q3/tables/q3_industry_shock_params.csv
  validation_output: outputs/q3/reports/q3_stress_validation.json
  report_output: outputs/q3/reports/q3_stress_validation.md
  c_pp: 40.0
  rho: 0.25
  eps: 0.000001
  lambdas:
    identity: 0.0
    light: 0.5
    medium: 1.0
    severe: 1.5
  unknown_policy: max_known_S

# Stage-four Q3 adapter.  It reuses the accepted Q2 optimizer and changes
# only main_risk_score; no Q2 source, configuration, or artifacts are written.
robust_optimization:
  risk_input: data/processed/q3_scenario_risk_scores.csv
  q2_strategy_input: data/processed/q2_credit_strategy.csv
  q2_optimization_config: src/_internal/q2_optimization_config.yaml
  scenarios: [identity, light, medium, severe, robust]
  robust_strategy_output: data/processed/q3_robust_credit_strategy.csv
  scenario_strategy_output: outputs/q3/tables/q3_scenario_credit_strategies.csv
  portfolio_summary_output: outputs/q3/tables/q3_portfolio_scenario_summary.csv
  adjustments_output: outputs/q3/tables/q3_strategy_adjustments.csv
  industry_output: outputs/q3/tables/q3_industry_exposure_comparison.csv
  fixed_q2_output: outputs/q3/tables/q3_fixed_q2_strategy_under_robust_risk.csv
  validation_output: outputs/q3/reports/q3_robust_optimization_validation.json
  report_output: outputs/q3/reports/q3_robust_optimization_validation.md
  numeric_tolerance: 0.000001

# Stage-five deterministic sensitivity analysis.  The centre values are the
# accepted stage-three/four robust-risk and stage-four Q2 optimizer settings;
# all non-official values below are modeling assumptions, not calibrations.
sensitivity_analysis:
  risk_input: data/processed/q3_scenario_risk_scores.csv
  mapping_input: data/processed/q3_enterprise_industry_mapping.csv
  q2_strategy_input: data/processed/q2_credit_strategy.csv
  q3_robust_strategy_input: data/processed/q3_robust_credit_strategy.csv
  q2_optimization_config: src/_internal/q2_optimization_config.yaml
  summary_output: outputs/q3/tables/q3_sensitivity_summary.csv
  stability_output: outputs/q3/tables/q3_enterprise_strategy_stability.csv
  long_output: outputs/q3/tables/q3_sensitivity_enterprise_strategies.csv
  industry_output: outputs/q3/tables/q3_sensitivity_industry_shocks.csv
  validation_output: outputs/q3/reports/q3_sensitivity_validation.json
  report_output: outputs/q3/reports/q3_sensitivity_validation.md
  full_validation_output: outputs/q3/reports/q3_full_validation.json
  full_report_output: outputs/q3/reports/q3_full_validation.md
  run_manifest_output: outputs/q3/reports/q3_run_manifest.json
  center:
    c_pp: 40.0
    rho: 0.25
    lambda_severe: 1.5
    unknown_policy: max_known_S
    lgd: 0.5
    funding_cost_rate: 0.03
  rho_values: [0.10, 0.25, 0.50]
  c_pp_values: [20.0, 40.0, 60.0]
  lambda_severe_values: [1.125, 1.5, 1.875]
  unknown_policies: [p50_known_S, max_known_S]
  lgd_values: [0.30, 0.50, 0.70]
  funding_cost_rates: [0.02, 0.03, 0.04]
  stability_frequency_threshold: 0.80
  risk_eps: 0.000001

# Stage-five plotting contract.  Python is persisted as the exclusive
# backend by the nature-figure routing gate.
figures:
  output_dir: outputs/q3/figures
  qa_output: outputs/q3/reports/q3_figure_qa.json
  qa_report_output: outputs/q3/reports/q3_figure_qa.md
  backend: python
