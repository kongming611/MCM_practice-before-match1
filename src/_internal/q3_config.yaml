# Stage-one Q3 settings.  Q2 outcome values are read from the manifests at run time.
paths:
  q2_optimization_manifest: outputs/q2/reports/q2_credit_optimization_manifest.json
  q2_risk_manifest: outputs/q2/reports/q2_risk_rating_run_manifest.json
  q2_model_config: src/_internal/q2_config.yaml
  baseline_contract_output: outputs/q3/reports/q3_q2_baseline_contract.json

checks:
  numeric_tolerance: 0.000001

# Stage-two deterministic industry mapping.  Only high-specificity keywords
# may produce a direct industry code; low-specificity hits are retained for
# audit and remain unknown.  The categories follow the Q3 NBS-2020Q1 coarse
# industry contract, not a claim about a firm's legally registered industry.
industry_mapping:
  input: data/processed/q2_risk_rating_scores.csv
  output: data/processed/q3_enterprise_industry_mapping.csv
  review_evidence_output: outputs/q3/tables/q3_industry_mapping_review_evidence.csv
  validation_output: outputs/q3/reports/q3_industry_mapping_validation.json
  report_output: outputs/q3/reports/q3_industry_mapping_validation.md
  generic_name_regex: '^个体经营E[0-9]+$'
  generic_expected_count: 56
  allowed_codes:
    - agriculture
    - manufacturing_industry
    - construction
    - wholesale_retail
    - transport_storage_post
    - accommodation_catering
    - finance
    - real_estate
    - information_software_it
    - leasing_business_services
    - other_services
    - unknown
  labels:
    agriculture: 农业
    manufacturing_industry: 制造业
    construction: 建筑业
    wholesale_retail: 批发和零售业
    transport_storage_post: 交通运输、仓储和邮政业
    accommodation_catering: 住宿和餐饮业
    finance: 金融业
    real_estate: 房地产业
    information_software_it: 信息传输、软件和信息技术服务业
    leasing_business_services: 租赁和商务服务业
    other_services: 其他服务业
    unknown: 未知行业

  # A keyword is high-specific only when it is meaningful evidence for one
  # coarse industry.  A name hitting more than one code is deliberately
  # ambiguous and is kept unknown.
  high_specific_keywords:
    agriculture:
      - 猕猴桃
      - 大闸蟹
      - 农副产品经营
      - 农业
      - 种植
      - 养殖
      - 果园
      - 园艺场
      - 专业合作社
    manufacturing_industry:
